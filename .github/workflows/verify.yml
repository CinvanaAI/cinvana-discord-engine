name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependency
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[test]"
      - name: Run fake-boundary tests
        run: python -B -m pytest -q
      - name: Compile package
        run: python -m compileall -q discord_engine
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
